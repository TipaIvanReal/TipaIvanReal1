name: Build Zero Hour game.dat

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Clone GeneralsGameCode
        shell: pwsh
        run: |
          git clone --recursive https://github.com/TheSuperHackers/GeneralsGameCode.git engine

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure
        working-directory: engine
        shell: pwsh
        run: cmake --preset win32

      - name: Build Release
        working-directory: engine
        shell: pwsh
        run: cmake --build build/win32 --config Release --parallel

      - name: Create game.dat
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $zh = Get-ChildItem -Path engine/build/win32 -Recurse -File -Filter generalszh.exe |
            Select-Object -First 1

          if (-not $zh) {
            Write-Error "generalszh.exe was not produced by the build."
            exit 1
          }

          Copy-Item $zh.FullName -Destination artifact/game.dat -Force
          Write-Host "Created game.dat from: $($zh.FullName)"
          Get-Item artifact/game.dat | Format-Table Name,Length,LastWriteTime

      - name: Verify game.dat
        shell: pwsh
        run: |
          if (-not (Test-Path artifact/game.dat)) {
            Write-Error "game.dat was not created."
            exit 1
          }

          $size = (Get-Item artifact/game.dat).Length
          if ($size -lt 1000000) {
            Write-Error "game.dat looks unexpectedly small: $size bytes"
            exit 1
          }

          Write-Host "game.dat verified successfully ($size bytes)."

      - name: Upload game.dat
        uses: actions/upload-artifact@v4
        with:
          name: ZeroHour-game-dat
          path: artifact/game.dat
          if-no-files-found: error
