name: Build Revolution modern renderer

on:
  push:
    branches: [ main, renderer-dev ]
    paths:
      - "revolution-renderer/**"
      - ".github/workflows/build-revolution-renderer.yml"
  workflow_dispatch:

concurrency:
  group: revolution-renderer-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone GeneralsGameCode
        shell: pwsh
        run: git clone --recursive https://github.com/TheSuperHackers/GeneralsGameCode.git engine

      - name: Apply Revolution renderer Phase 1
        shell: pwsh
        run: .\revolution-renderer\phase1\apply-phase1.ps1

      - name: Apply Revolution renderer Phase 6.4
        shell: pwsh
        run: .\revolution-renderer\phase6\apply-phase6.ps1

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure
        working-directory: engine
        shell: pwsh
        run: cmake --preset win32

      - name: Build Release
        working-directory: engine
        shell: pwsh
        run: cmake --build build/win32 --config Release --target z_generals --parallel

      - name: Package renderer preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $zh = Get-ChildItem -Path engine/build/win32 -Recurse -File -Filter generalszh.exe |
            Select-Object -First 1

          if (-not $zh) {
            Write-Error "generalszh.exe was not produced."
            exit 1
          }

          Copy-Item $zh.FullName -Destination package/generalszh_revolution.exe -Force

          @"
          Revolution Project Modern Renderer - Phase 6.4

          Run: generalszh_revolution.exe

          IMPORTANT:
          Keep third-party d3d8.dll hooks disabled while testing this build.

          Phase 1 + 6:
          - Direct3D 12 capability/device probe remains available.
          - Terrain rendering now installs a programmable material shader at the actual HeightMap draw call.
          - The terrain shader now preserves Generals' native two-UV atlas blend instead of sampling across atlas cells.
          - Original per-vertex terrain lighting is preserved inside the programmable pass.
          - Terrain filtering remains anisotropic 16x.
          - This build intentionally skips the old Phase 2-5 post-process/lighting experiments.

          This is a playable bridge build; native DX12 scene rendering is still being migrated.
          "@ | Set-Content package/README.txt -Encoding UTF8

          $hash = (Get-FileHash package/generalszh_revolution.exe -Algorithm SHA256).Hash
          "SHA256  generalszh_revolution.exe  $hash" | Set-Content package/SHA256.txt -Encoding ASCII

          Compress-Archive -Path package/* -DestinationPath RevolutionProject-ModernRenderer-Phase6_4.zip -Force

          Get-Item package/generalszh_revolution.exe, RevolutionProject-ModernRenderer-Phase6_4.zip |
            Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionProject-ModernRenderer-Phase6_4
          path: RevolutionProject-ModernRenderer-Phase6_4.zip
          if-no-files-found: error

      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "revolution-renderer-phase6_4"
          $asset = "RevolutionProject-ModernRenderer-Phase6_4.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --target "${{ github.sha }}" --title "Revolution Modern Renderer - Phase 6.4" --notes "Playable terrain-shader bridge build with corrected two-UV terrain atlas blending. Native D3D12 scene rendering is still being migrated."
          } else {
            gh release upload $tag $asset --clobber
          }
