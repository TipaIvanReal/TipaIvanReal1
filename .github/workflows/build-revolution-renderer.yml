name: Build Revolution modern renderer

on:
  push:
    branches: [ main, renderer-dev ]
    paths:
      - "revolution-renderer/**"
      - ".github/workflows/build-revolution-renderer.yml"
  workflow_dispatch:

concurrency:
  group: revolution-renderer-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone GeneralsGameCode
        shell: pwsh
        run: git clone --recursive https://github.com/TheSuperHackers/GeneralsGameCode.git engine

      - name: Apply Revolution renderer Phase 1
        shell: pwsh
        run: .\revolution-renderer\phase1\apply-phase1.ps1

      - name: Apply Revolution renderer Phase 2
        shell: pwsh
        run: .\revolution-renderer\phase2\apply-phase2.ps1

      - name: Apply Revolution renderer Phase 4
        shell: pwsh
        run: .\revolution-renderer\phase3\apply-phase3.ps1

      - name: Apply Revolution renderer Phase 4
        shell: pwsh
        run: .\revolution-renderer\phase4\apply-phase4.ps1

      - name: Setup MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure
        working-directory: engine
        shell: pwsh
        run: cmake --preset win32

      - name: Build Release
        working-directory: engine
        shell: pwsh
        run: cmake --build build/win32 --config Release --target z_generals --parallel

      - name: Package renderer preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null

          $zh = Get-ChildItem -Path engine/build/win32 -Recurse -File -Filter generalszh.exe |
            Select-Object -First 1

          if (-not $zh) {
            Write-Error "generalszh.exe was not produced."
            exit 1
          }

          Copy-Item $zh.FullName -Destination package/generalszh_revolution.exe -Force

          @"
          Revolution Project Modern Renderer - Phase 4

          Run: generalszh_revolution.exe

          IMPORTANT:
          Keep third-party d3d8.dll hooks disabled while testing this build.

          Phase 1 + 2 + 3 + 4:
          - Direct3D 12 device/capability probe is initialized inside the engine.
          - Writes RevolutionRenderer.log next to the executable.
          - Water reflection render target increased from 256 to 1024.
          - Renderer default texture filtering upgraded to anisotropic 16x.
          - Always-on cinematic color grade and highlight bloom.
          - Default tactical view now explicitly runs the cinematic pass every frame.
          - Stronger directional terrain/object lighting and specular response.
          - Darker, cooler shadows with filtered projected shadow decals.
          - More reflective, higher-frequency water response.
          - Legacy WW3D/D3D8 draw path remains active while render calls are migrated.

          This is a playable bridge build; native DX12 scene rendering is still being migrated.
          "@ | Set-Content package/README.txt -Encoding UTF8

          $hash = (Get-FileHash package/generalszh_revolution.exe -Algorithm SHA256).Hash
          "SHA256  generalszh_revolution.exe  $hash" | Set-Content package/SHA256.txt -Encoding ASCII

          Compress-Archive -Path package/* -DestinationPath RevolutionProject-ModernRenderer-Phase4.zip -Force

          Get-Item package/generalszh_revolution.exe, RevolutionProject-ModernRenderer-Phase4.zip |
            Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RevolutionProject-ModernRenderer-Phase4
          path: RevolutionProject-ModernRenderer-Phase4.zip
          if-no-files-found: error

      - name: Publish preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "revolution-renderer-phase4"
          $asset = "RevolutionProject-ModernRenderer-Phase4.zip"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --target "${{ github.sha }}" --title "Revolution Modern Renderer - Phase 4" --notes "Playable bridge build: internal Direct3D 12 capability layer, 1024px water reflections, 16x anisotropic filtering, cinematic color grade and highlight bloom. Native DX12 scene rendering is still being migrated."
          } else {
            gh release upload $tag $asset --clobber
          }
